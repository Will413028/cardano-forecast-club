name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forecast
          POSTGRES_PASSWORD: forecast-local-only
          POSTGRES_DB: forecast
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U forecast"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: make check
      - run: make e2e
      - run: pnpm exec tsx scripts/admin-smoke.ts
      - run: python3 scripts/mutation-audit.py
      - run: python3 verifier-ref/benchmark.py
      - run: make verify-clean
      - run: make ops-check
      - run: pnpm exec playwright install --with-deps chromium
      - run: DEMO_SEED=1 pnpm e2e
      - name: Browser round
        run: |
          pnpm dev > /tmp/forecast-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3318/api/config >/dev/null; then break; fi
            sleep 1
          done
          pnpm exec tsx scripts/browser-qa.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            var/screenshots
            var/mutation-results.json
            var/benchmark-result.json
